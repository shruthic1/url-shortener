name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once. A new push waits for the running one to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: urlshortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE_URL: http://localhost:3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: shortener
      DB_PASSWORD: ci-only
      DB_SSL: "false"
      TEST_DB_NAME: urlshortener_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: node scripts/migrate.js
        env:
          DB_NAME: urlshortener_test

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      HEALTH_URL: https://go.shruthic.me/health

    steps:
      # OIDC federation was the original design, but the free-plan account sits under an
      # AWS organization policy that denies creating an OIDC identity provider. The
      # fallback is a dedicated IAM user whose only permission is the deploy policy
      # (infra/github-deploy-permissions.json). See ARCHITECTURE.md, "Issues encountered".
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy.sh on the instance
        id: send
        run: |
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "deploy $GITHUB_SHA" \
            --timeout-seconds 600 \
            --parameters "commands=[\"bash /opt/app/deploy/deploy.sh $GITHUB_SHA\"]" \
            --query 'Command.CommandId' --output text)
          echo "Sent SSM command $command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the command to finish
        run: |
          # `wait` exits non-zero if the command failed; the next step reports why.
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID" || true

      - name: Show command output and check its status
        run: |
          invocation=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID")

          echo "::group::deploy.sh stdout"
          echo "$invocation" | jq -r '.StandardOutputContent'
          echo "::endgroup::"
          echo "::group::deploy.sh stderr"
          echo "$invocation" | jq -r '.StandardErrorContent'
          echo "::endgroup::"

          status=$(echo "$invocation" | jq -r '.Status')
          echo "SSM command status: $status"
          if [ "$status" != "Success" ]; then
            echo "::error::deploy.sh failed on the instance (status: $status)"
            exit 1
          fi

      - name: Verify live health check
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL" || true)
            echo "attempt $attempt: $HEALTH_URL -> $code"
            if [ "$code" = "200" ]; then
              curl -s "$HEALTH_URL"; echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::$HEALTH_URL did not return 200"
          exit 1
