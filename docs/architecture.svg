<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" width="1160" height="650" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>URL shortener architecture: how a request travels from the browser to the app and back</title>
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <marker id="aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <rect width="1160" height="650" fill="#ffffff"/>

  <text x="30" y="30" font-size="17" font-weight="600" fill="#1f2328">How a request to go.shruthic.me travels</text>

  <!-- Outside AWS: DNS, browser, destination -->
  <rect x="30" y="70" width="170" height="80" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="115" y="104" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Namecheap DNS</text>
  <text x="115" y="124" font-size="12" text-anchor="middle" fill="#57606a">go → Elastic IP</text>

  <rect x="40" y="260" width="150" height="120" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <circle cx="115" cy="305" r="22" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <ellipse cx="115" cy="305" rx="9" ry="22" fill="none" stroke="#1f2328" stroke-width="1.2"/>
  <line x1="93" y1="305" x2="137" y2="305" stroke="#1f2328" stroke-width="1.2"/>
  <text x="115" y="355" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Browser</text>

  <rect x="40" y="470" width="150" height="60" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="115" y="497" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Destination site</text>
  <text x="115" y="515" font-size="11" text-anchor="middle" fill="#57606a">the original long URL</text>

  <!-- AWS region / VPC -->
  <rect x="240" y="45" width="900" height="530" rx="16" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="1124" y="68" font-size="13" font-weight="600" text-anchor="end" fill="#57606a">AWS us-east-2, default VPC</text>

  <!-- Elastic IP -->
  <rect x="260" y="295" width="110" height="50" rx="25" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="315" y="325" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Elastic IP</text>

  <!-- Web security group -->
  <rect x="400" y="160" width="430" height="310" rx="12" fill="none" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="412" y="181" font-size="12" font-weight="600" fill="#bc4c00">Web security group: inbound 80, 443</text>

  <!-- EC2 instance -->
  <rect x="420" y="195" width="390" height="260" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="432" y="215" font-size="12" font-weight="600" fill="#1f2328">EC2 t3.micro, Amazon Linux 2023</text>

  <!-- nginx: tall pill like the sketch's gateway -->
  <rect x="460" y="235" width="110" height="190" rx="45" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="515" y="318" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">nginx</text>
  <text x="515" y="338" font-size="11" text-anchor="middle" fill="#57606a">HTTPS (Let's</text>
  <text x="515" y="352" font-size="11" text-anchor="middle" fill="#57606a">Encrypt), proxy</text>

  <!-- Express app -->
  <rect x="620" y="280" width="170" height="100" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="705" y="310" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Express app</text>
  <text x="705" y="330" font-size="11" text-anchor="middle" fill="#57606a">127.0.0.1:3000 only</text>
  <text x="705" y="348" font-size="11" text-anchor="middle" fill="#57606a">systemd, user "app"</text>

  <!-- DB security group -->
  <rect x="890" y="215" width="230" height="240" rx="12" fill="none" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="902" y="236" font-size="12" font-weight="600" fill="#bc4c00">DB security group:</text>
  <text x="902" y="252" font-size="12" font-weight="600" fill="#bc4c00">5432 from web SG only</text>

  <!-- RDS cylinder -->
  <path d="M950 282 V 388 A 55 12 0 0 0 1060 388 V 282" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <path d="M950 318 A 55 12 0 0 0 1060 318" fill="none" stroke="#1f2328" stroke-width="1"/>
  <ellipse cx="1005" cy="282" rx="55" ry="12" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="1005" y="345" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">RDS</text>
  <text x="1005" y="362" font-size="11" text-anchor="middle" fill="#57606a">PostgreSQL</text>
  <text x="1005" y="377" font-size="11" text-anchor="middle" fill="#57606a">no public address</text>

  <!-- Parameter Store cylinder (like the sketch's cache) -->
  <path d="M935 92 V 158 A 85 12 0 0 0 1105 158 V 92" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <ellipse cx="1020" cy="92" rx="85" ry="12" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="1020" y="128" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">SSM Parameter Store</text>
  <text x="1020" y="146" font-size="11" text-anchor="middle" fill="#57606a">DB password, encrypted</text>

  <!-- 1, 2: DNS lookup -->
  <line x1="95" y1="258" x2="95" y2="153" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>
  <line x1="135" y1="152" x2="135" y2="257" stroke="#0969da" stroke-width="1.6" marker-end="url(#res)"/>

  <!-- 3, 8: browser and Elastic IP -->
  <line x1="190" y1="308" x2="257" y2="308" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>
  <line x1="260" y1="333" x2="193" y2="333" stroke="#0969da" stroke-width="1.6" marker-end="url(#res)"/>

  <!-- Elastic IP and nginx -->
  <line x1="370" y1="308" x2="457" y2="308" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>
  <line x1="460" y1="333" x2="373" y2="333" stroke="#0969da" stroke-width="1.6" marker-end="url(#res)"/>

  <!-- 4, 7: nginx and app -->
  <line x1="570" y1="308" x2="617" y2="308" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>
  <line x1="620" y1="345" x2="573" y2="345" stroke="#0969da" stroke-width="1.6" marker-end="url(#res)"/>

  <!-- 5, 6: app and RDS -->
  <line x1="790" y1="308" x2="947" y2="308" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>
  <line x1="950" y1="345" x2="793" y2="345" stroke="#0969da" stroke-width="1.6" marker-end="url(#res)"/>

  <!-- 9: browser follows redirect -->
  <line x1="115" y1="380" x2="115" y2="467" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>

  <!-- App reads password at startup -->
  <path d="M705 280 V 125 H 932" fill="none" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aux)"/>
  <text x="818" y="116" font-size="11" text-anchor="middle" fill="#6e7781">password, at startup</text>

  <!-- Number badges -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="77" cy="205" r="10" fill="#1f2328"/><text x="77" y="209" fill="#fff">1</text>
    <circle cx="153" cy="205" r="10" fill="#0969da"/><text x="153" y="209" fill="#fff">2</text>
    <circle cx="224" cy="293" r="10" fill="#1f2328"/><text x="224" y="297" fill="#fff">3</text>
    <circle cx="594" cy="293" r="10" fill="#1f2328"/><text x="594" y="297" fill="#fff">4</text>
    <circle cx="845" cy="293" r="10" fill="#1f2328"/><text x="845" y="297" fill="#fff">5</text>
    <circle cx="845" cy="361" r="10" fill="#0969da"/><text x="845" y="365" fill="#fff">6</text>
    <circle cx="594" cy="361" r="10" fill="#0969da"/><text x="594" y="365" fill="#fff">7</text>
    <circle cx="224" cy="349" r="10" fill="#0969da"/><text x="224" y="353" fill="#fff">8</text>
    <circle cx="133" cy="425" r="10" fill="#1f2328"/><text x="133" y="429" fill="#fff">9</text>
  </g>

  <!-- Step key -->
  <g font-size="12" fill="#1f2328">
    <text x="260" y="500" font-weight="600">Steps</text>
    <text x="260" y="520">1 Browser asks DNS where go.shruthic.me is</text>
    <text x="260" y="538">2 DNS answers with the Elastic IP</text>
    <text x="260" y="556">3 HTTPS request; the web SG lets 443 in</text>
    <text x="560" y="520">4 nginx decrypts it and forwards to localhost</text>
    <text x="560" y="538">5 App runs one UPDATE ... RETURNING query</text>
    <text x="560" y="556">6 RDS returns the long URL, count +1</text>
    <text x="870" y="520">7 App replies 302 with the long URL</text>
    <text x="870" y="538">8 nginx sends it back over HTTPS</text>
    <text x="870" y="556">9 Browser follows the redirect itself</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#57606a">
    <line x1="30" y1="610" x2="70" y2="610" stroke="#1f2328" stroke-width="1.6" marker-end="url(#req)"/>
    <text x="80" y="614">Request</text>
    <line x1="160" y1="610" x2="200" y2="610" stroke="#0969da" stroke-width="1.6" marker-end="url(#res)"/>
    <text x="210" y="614">Response</text>
    <line x1="300" y1="610" x2="340" y2="610" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aux)"/>
    <text x="350" y="614">Read once at startup</text>
    <rect x="510" y="602" width="34" height="16" rx="4" fill="none" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="554" y="614">Security group (firewall)</text>
    <rect x="730" y="602" width="34" height="16" rx="4" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="8 5"/>
    <text x="774" y="614">AWS region and VPC</text>
  </g>
</svg>
