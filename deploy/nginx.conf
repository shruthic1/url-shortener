# nginx server block for the URL shortener (HTTP only).
#
# Install as root:
#   install -o root -g root -m 644 nginx.conf /etc/nginx/conf.d/url-shortener.conf
#   nginx -t && systemctl reload nginx
#
# Then run certbot, which adds the HTTPS server block and the HTTP -> HTTPS redirect:
#   certbot --nginx -d go.shruthic.me

server {
    listen 80;
    listen [::]:80;
    server_name go.shruthic.me;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
